services:
  redis:
    image: redis:7-alpine
    container_name: localoy-bot-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6385}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: localoy-bot
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ENV=production
      - LOG_FORMAT=json
      - LOG_LEVEL=INFO

volumes:
  redis_data:
    driver: local
